<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VoxHelp - Statistiques</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(180deg, #f5f7fb 0%, #eef2f7 100%);
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .stats-card {
            width: 100%;
            max-width: 680px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
            padding: 40px 28px;
            text-align: center;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 16px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #eef4ff;
            color: #2952a3;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.3px;
        }

        h1 {
            margin: 0;
            font-size: 40px;
            line-height: 1.1;
        }

        .subtitle {
            margin: 14px auto 0;
            max-width: 520px;
            font-size: 18px;
            line-height: 1.5;
            color: #5f6368;
        }

        .counter-box {
            margin: 34px auto 0;
            padding: 28px 20px;
            max-width: 420px;
            background: #f8fafc;
            border: 1px solid #e7ebf0;
            border-radius: 20px;
        }

        .number {
            margin: 0;
            font-size: 84px;
            line-height: 1;
            font-weight: bold;
            color: #1f3f8f;
        }

        .label {
            margin-top: 14px;
            font-size: 22px;
            font-weight: bold;
            color: #202124;
        }

        .note {
            margin-top: 10px;
            font-size: 15px;
            line-height: 1.5;
            color: #5f6368;
        }

        .update {
            margin-top: 28px;
            font-size: 14px;
            color: #777;
        }

        .actions {
            margin-top: 28px;
        }

        .button {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 14px;
            background: #202124;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }

        .button:hover {
            background: #111214;
        }

        @media (max-width: 640px) {

            .stats-card {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .number {
                font-size: 68px;
            }

            .label {
                font-size: 19px;
            }

        }

    </style>

</head>

<body>

    <div class="stats-card">

        <div class="eyebrow">
            VoxHelp
        </div>

        <h1>Statistiques d’installation</h1>

        <div class="subtitle">
            Compteur global des installations détectées de VoxHelp.
        </div>

        <div class="counter-box">

            <div
                id="installCount"
                class="number"
            >
                …
            </div>

            <div class="label">
                installations détectées
            </div>

            <div class="note">
                Total cumulé affiché par le compteur public.
            </div>

        </div>

        <div
            id="updateTime"
            class="update"
        ></div>

        <div class="actions">
            <a
                class="button"
                href="https://wrelax1.github.io/voxhelp-3/"
            >
                Ouvrir VoxHelp
            </a>
        </div>

    </div>

<script>

fetch(
    'https://counterapi.com/api/wrelax1.github.io/install/voxhelp-2-1?readOnly=true'
)
.then(function (response) {
    return response.json();
})
.then(function (data) {

    document.getElementById('installCount').textContent =
        data.value ?? 0;

    document.getElementById('updateTime').textContent =
        'Consulté le ' +
        new Date().toLocaleString('fr-CH');

})
.catch(function () {

    document.getElementById('installCount').textContent = '—';

    document.getElementById('updateTime').textContent =
        'Compteur momentanément indisponible';

});

</script>

</body>
</html>
